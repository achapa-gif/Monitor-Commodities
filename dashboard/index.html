<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Insumos</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --wash: rgba(11,11,11,0.05);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  /* Estados (fijos en ambos modos): alertas de mercado y riesgo de costo. */
  --st-critico: #d03b3b; --st-serio: #ec835a; --st-bueno: #0ca30c; --st-neutro: #898781;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 1320px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.marca { display: flex; align-items: center; gap: 20px; min-width: 0; flex: 1 1 560px; }
.hdr-der { flex: 0 0 auto; }
.marca img { height: 56px; width: auto; flex: none; }
.marca .div { width: 1px; align-self: stretch; background: var(--grid); flex: none; }
@media (max-width: 640px) { .marca { flex-direction: column; align-items: flex-start; gap: 10px; } .marca .div { display: none; } .marca img { height: 44px; } }
h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0; font-weight: 600; }
.meta { color: var(--ink-2); font-size: 13px; }
.meta b { color: var(--ink); font-weight: 600; }

.hdr-der { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
@media (max-width: 900px) { .hdr-der { align-items: flex-start; } }
.controles { display: flex; flex-wrap: wrap; gap: 8px; }
.seg-sm button { font-size: 12px; padding: 3px 9px; }

/* Buscador */
.buscar { position: relative; width: 340px; max-width: 100%; }
.buscar svg { position: absolute; left: 11px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.buscar input { width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 12px 8px 34px; outline: none; }
.buscar input:focus { border-color: var(--axis); box-shadow: 0 0 0 3px var(--wash); }
#sugerencias { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.14); }
#sugerencias li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
#sugerencias li[aria-selected="true"], #sugerencias li:hover { background: var(--wash); }
#sugerencias .sg-n { flex: 1; min-width: 0; font-weight: 600; }
#sugerencias .sg-n small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sugerencias .sg-vacio { color: var(--muted); cursor: default; }

/* Encabezado del semáforo con selector de periodo */
.sem-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 12px; }
.sem-head h2 { font-size: 17px; }
.sem-head .sem-h { color: var(--muted); font-weight: 500; }
.sem-acc, .det-acc { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sem-plbl { font-size: 12px; color: var(--muted); }
.sem.sem-cambio { animation: semCambio .6s ease-out; }
.sem.sem-cambio .sem-luz { animation: semLuz .6s ease-out; }
@keyframes semCambio { 0% { transform: translateY(6px); opacity: .35; } 100% { transform: none; opacity: 1; } }
@keyframes semLuz { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .sem.sem-cambio, .sem.sem-cambio .sem-luz { animation: none; } }
.aviso-error { background: #fdecea; color: #7a1c1c; border-bottom: 1px solid #f3b4ae; padding: 10px 16px; font-size: 13px; text-align: center; }
.sem-head .seg-sm button { font-size: 13px; padding: 5px 12px; font-weight: 600; }

/* Filtros y orden de la tabla */
.tf-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 10px; }
.tf-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tf-chips button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 999px; cursor: pointer; min-height: 32px; }
.tf-chips button span { color: var(--muted); font-variant-numeric: tabular-nums; }
.tf-chips button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tf-chips button[aria-pressed="true"] span { color: inherit; opacity: .7; }
.tf-chips i { width: 8px; height: 8px; border-radius: 50%; }
.tf-alto { background: var(--st-critico); } .tf-moderado { background: var(--st-serio); } .tf-bajo { background: var(--st-bueno); }
.tf-info { font-size: 12px; color: var(--muted); }
.tf-limpiar { border: 0; background: none; color: var(--ink-2); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
table.monitor th .ord { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 0; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
table.monitor th .ord span { font-size: 10px; opacity: .55; }
table.monitor th[aria-sort="ascending"] .ord, table.monitor th[aria-sort="descending"] .ord { color: var(--ink); font-weight: 600; }
table.monitor th[aria-sort="ascending"] .ord span, table.monitor th[aria-sort="descending"] .ord span { opacity: 1; }
table.monitor th.num .ord { justify-content: flex-end; }
table.monitor .hz { background: var(--wash); }
table.monitor th.hz .ord { color: var(--ink); font-weight: 600; }
table.monitor tr.sin td { text-align: center; color: var(--muted); padding: 24px; }
.solo-movil, .solo-print { display: none; }

/* Celular: la tabla se vuelve tarjetas, una por commodity */
@media (max-width: 760px) {
  main { padding: 16px 12px 48px; }
  h1 { font-size: 19px; }
  .marca .meta { font-size: 12px; }
  .hdr-der { width: 100%; }
  .buscar { width: 100%; }
  .buscar input { font-size: 16px; padding: 11px 12px 11px 36px; }   /* 16px evita el zoom automático en iOS */
  .seg-sm button { padding: 6px 11px; font-size: 13px; }
  .sem-head .seg-sm { flex: 1; } .sem-head .seg-sm button { flex: 1; }
  .sem-acc { width: 100%; }
  .sem-luz { width: 36px; height: 36px; }
  .sem-n b { font-size: 28px; }
  .chip { min-height: 32px; }
  .card { padding: 14px 12px; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tabs button { white-space: nowrap; padding: 10px 12px; }
  #monitor .tabla-wrap { overflow: visible; }
  table.monitor, table.monitor tbody { display: block; }
  table.monitor thead { display: none; }
  table.monitor tr.fam { display: block; }
  table.monitor tr.fam th { display: block; border-radius: 8px; margin-top: 10px; }
  table.monitor tr[data-ir] { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 8px 10px; padding: 12px 4px; border-bottom: 1px solid var(--grid); }
  table.monitor tr[data-ir] td { display: block; padding: 0; border: 0; text-align: left; min-width: 0; }
  table.monitor tr[data-ir] td.com { grid-column: 1 / 4; display: flex; min-width: 0; }
  table.monitor tr[data-ir] td.precio { grid-column: 4; text-align: right; }
  table.monitor td.precio .solo-movil { display: block; }
  table.monitor tr[data-ir] td.rgcel { grid-column: 1 / -1; min-width: 0; }
  table.monitor td.rgcel small { max-width: none; }
  table.monitor tr[data-ir] td.uni, table.monitor tr[data-ir] td.spk { display: none; }
  table.monitor tr[data-ir] td.fte { grid-column: 1 / -1; min-width: 0; font-size: 12px; }
  table.monitor tr.sin { display: block; } table.monitor tr.sin td { display: block; }
  table.monitor td.num[data-l]:not(.precio) { font-size: 13px; }
  table.monitor td[data-l]:not(.precio):not(.rgcel)::before { content: attr(data-l); display: block; font-size: 10.5px; color: var(--muted); font-weight: 500; }
  table.monitor td.fte::before { display: none !important; }
  table.monitor .hz { border-radius: 6px; padding: 2px 4px; }
  .grid2 { grid-template-columns: 1fr; }
}

/* PDF / impresión: solo el semáforo (fijo a 3 meses) y el monitor de precios */
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  :root { color-scheme: light; --page: #fff; --surface: #fff; --ink: #0b0b0b; --ink-2: #52514e; --muted: #6d6b66; --grid: #e1e0d9; --axis: #c3c2b7;
    --border: rgba(11,11,11,.14); --wash: rgba(11,11,11,.05); --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; font-size: 11px; }
  main { max-width: none; padding: 0; }
  .no-print, .det-head, .tabs, .grid2, #metodologia, #tabla, .secundaria, .card:has(#tabla) { display: none !important; }
  .solo-print { display: block; }
  .impresion-cab { font-size: 11px; color: var(--ink-2); margin: -8px 0 10px; }
  .hdr-der .meta { font-size: 11px; }
  .card, .sem, .dest { box-shadow: none; break-inside: avoid; }
  .semaforo { gap: 8px; margin-bottom: 8px; }
  .sem { padding: 10px 12px; }
  .chip { padding: 2px 8px; font-size: 10.5px; }
  table.monitor { font-size: 10px; }
  table.monitor td, table.monitor th { padding: 4px 6px; }
  table.monitor tr { break-inside: avoid; }
  #monitor { break-before: auto; }
}
.semaforo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 800px) { .semaforo { grid-template-columns: 1fr; } }
.sem { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; position: relative; overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 16px rgba(0,0,0,.03); }
.sem::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
.sem-alto { --c: var(--st-critico); } .sem-moderado { --c: var(--st-serio); } .sem-bajo { --c: var(--st-bueno); }
.sem-top { display: flex; align-items: center; gap: 14px; }
.sem-luz { width: 44px; height: 44px; border-radius: 50%; flex: none; background: var(--c);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 16%, transparent); }
.sem-tit { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.sem-niv { font-size: 22px; font-weight: 700; line-height: 1.1; }
.sem-n { margin-left: auto; text-align: right; }
.sem-n b { display: block; font-size: 34px; font-weight: 700; line-height: 1; }
.sem-n span { font-size: 11px; color: var(--muted); }
.sem-desc { color: var(--ink-2); font-size: 12.5px; margin: 10px 0 8px; }
.sem .chips { margin-top: 0; }
.sem-lbl { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
.destacados { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
@media (max-width: 800px) { .destacados { grid-template-columns: 1fr; } }
.dest { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; }
.dest:hover { background: var(--wash); }
.dest-t { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; min-width: 120px; }
.dest b { font-weight: 650; }
.dest-v { font-size: 18px; font-weight: 700; }
.dest-s { font-size: 11px; color: var(--muted); margin-left: auto; }

/* Detalle por familia: pestañas */
.det-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; margin: 28px 0 0; }
.det-head h2.seccion { margin: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--grid); margin: 12px 0 16px; }
.tabs button { border: 0; background: none; font: inherit; font-size: 14px; color: var(--ink-2); padding: 10px 14px; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 650; border-bottom-color: var(--ink); }
.tabs .cnt { font-size: 11px; color: var(--muted); font-weight: 500; }
.tabs .tab-rg { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--ink-2);
  background: var(--wash); border-radius: 999px; padding: 0 7px; }
.tabs .tab-rg i { width: 7px; height: 7px; border-radius: 50%; background: var(--st-critico); }
.filtro { display: flex; align-items: center; gap: 8px; }
.filtro > span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.seg button:hover { background: var(--wash); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }

.resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 8px; }
.grupo { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.grupo h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.grupo h3 .ico { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 11px;
  background: var(--wash); color: var(--ink); }
.grupo h3 .n { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 13px; }
.grupo ul { list-style: none; margin: 0; padding: 0; }
.grupo li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid var(--grid); font-size: 13px; }
.grupo li:first-child { border-top: 0; }
.grupo li .q { color: var(--ink-2); }
.grupo li .q small { color: var(--muted); font-size: 12px; }
.grupo li b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.grupo .nada { color: var(--muted); font-size: 13px; }
.criterio { color: var(--muted); font-size: 12px; margin: 0 0 20px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; text-align: left; font: inherit; color: inherit;
  display: flex; flex-direction: column; justify-content: flex-start; }
.tile:hover { border-color: var(--axis); }
.tile .nom { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.tile .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.tile .val { font-size: 26px; font-weight: 650; margin-top: 6px; letter-spacing: -0.01em; }
.tile .uni { color: var(--ink-2); font-size: 12px; }
.tile .deltas { display: flex; flex-wrap: wrap; gap: 2px 14px; white-space: nowrap; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.tile .deltas b { color: var(--ink); font-weight: 600; }
.tile .orig { color: var(--muted); font-size: 12px; margin-top: 6px; }
.tile .mx { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; margin-top: auto; padding-top: 10px;
  border-top: 1px solid var(--grid); font-size: 12px; color: var(--ink-2); }
.tile .mx b { color: var(--ink); font-weight: 600; }
.tile .orig { margin-bottom: 10px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px 16px; margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 16px rgba(0,0,0,.03); }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; margin-bottom: 12px; }
.card-head h2 { display: flex; align-items: center; gap: 10px; }
.card-head h2 .sw { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.card-head .sub { color: var(--ink-2); font-size: 12px; background: var(--wash); padding: 2px 8px; border-radius: 999px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 16px; }
.grid2 .card { margin-bottom: 0; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.legend button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--surface);
  color: var(--ink-2); font: inherit; font-size: 12px; padding: 4px 10px 4px 8px; border-radius: 999px; cursor: pointer; max-width: 100%;
  transition: background .15s, opacity .15s; }
.legend button:hover { background: var(--wash); }
.legend button[aria-pressed="false"] { opacity: .45; }
.legend button[aria-pressed="false"] i { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }
.legend button .ln { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend button b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .endlbl { font-size: 11px; fill: var(--ink); font-weight: 600; }
.chart .reflbl { font-size: 10px; fill: var(--ink-2); opacity: .7; }
.chart .ext text { font-size: 10.5px; fill: var(--ink-2); font-weight: 500; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.chart .serie, .chart .serie-fin, .chart .area { transition: opacity .2s; }
.chart .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trazo 1.1s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes trazo { to { stroke-dashoffset: 0; } }
.chart .area { animation: aparecer .9s ease-out; }
@keyframes aparecer { from { opacity: 0; } }
.chart .hit:focus { outline: none; }
.chart .hit:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; font-size: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.14); white-space: nowrap; display: none; z-index: 3; min-width: 200px; }
.tip .f { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--grid); }
.tip .f b { color: var(--ink); font-weight: 600; }
.tip .r { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 2px 0; }
.tip .r span:first-child { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip .r em { color: var(--muted); font-style: normal; }
.tip .r b { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
.tip .r small { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; min-width: 52px; }
.tip .pie { color: var(--muted); font-size: 10.5px; margin-top: 6px; text-align: right; }
.tip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.nota { color: var(--muted); font-size: 12px; margin-top: 6px; }
.vacio { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }

/* Alertas de mercado: el color va en el punto; el texto siempre en tinta, con etiqueta. */
.al, .rg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.al i, .rg i, .al-kpi-t i { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--st-neutro); }
.al-af i, .al-kpi.al-af .al-kpi-t i { background: var(--st-critico); }
.al-am i, .al-kpi.al-am .al-kpi-t i { background: var(--st-serio); }
.al-es i, .al-kpi.al-es .al-kpi-t i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--st-neutro); }
.al-bm i, .al-kpi.al-bm .al-kpi-t i { background: var(--st-bueno); }
.al-bf i, .al-kpi.al-bf .al-kpi-t i { background: var(--s1); }
.rg-alto i { background: var(--st-critico); }
.rg-moderado i { background: var(--st-serio); }
.rg-bajo i { background: var(--st-bueno); }
.al-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) repeat(2, minmax(0, 1.25fr)); gap: 10px; }
@media (max-width: 1100px) { .al-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } .al-ext { grid-column: span 5; } }
@media (max-width: 640px) { .al-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .al-ext { grid-column: span 1; } }
.al-kpi, .al-ext { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.al-kpi { border-top: 3px solid var(--st-neutro); }
.al-kpi.al-af { border-top-color: var(--st-critico); }
.al-kpi.al-am { border-top-color: var(--st-serio); }
.al-kpi.al-bm { border-top-color: var(--st-bueno); }
.al-kpi.al-bf { border-top-color: var(--s1); }
.al-kpi-t { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.al-kpi-n { font-size: 28px; font-weight: 650; margin-top: 2px; }
.al-kpi-r { font-size: 11px; color: var(--muted); }
.al-ext { background: var(--wash); }
.al-ext-t { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.al-ext-n { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-top: 4px; }
.al-ext-n small { color: var(--muted); font-weight: 400; font-size: 11px; }
.al-ext-v { font-size: 22px; font-weight: 650; }
.al-ext-s { font-size: 11px; color: var(--muted); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.presion { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--grid); }
@media (max-width: 800px) { .presion { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  font: inherit; font-size: 12px; padding: 3px 10px 3px 8px; border-radius: 999px; cursor: pointer; }
.chip:hover { background: var(--wash); }
.chip b { color: var(--ink); font-weight: 600; }
.alertas .criterio { margin: 12px 0 0; }
.nada { color: var(--muted); font-size: 12px; }

/* Tabla de monitoreo */
table.monitor { font-size: 12.5px; }
table.monitor th { text-align: left; }
table.monitor th.num, table.monitor td.num { text-align: right; }
table.monitor td { text-align: left; vertical-align: middle; padding: 7px 10px; }
table.monitor tr.fam th { background: var(--wash); color: var(--ink); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px; position: static; }
table.monitor tbody tr[data-ir] { cursor: pointer; }
table.monitor tbody tr[data-ir]:hover td { background: var(--wash); }
table.monitor tbody tr[data-ir]:focus-visible { outline: 2px solid var(--s1); outline-offset: -2px; }
table.monitor td small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; white-space: normal; }
table.monitor th, table.monitor td { padding-left: 8px; padding-right: 8px; }
td.com { display: flex; align-items: center; gap: 10px; min-width: 150px; }
td.com b { font-weight: 600; }
td.rgcel { min-width: 150px; white-space: normal; }
td.rgcel small { max-width: 180px; }
td.fte { min-width: 110px; white-space: normal; color: var(--ink-2); }
td.uni { color: var(--ink-2); }
td.vacia { color: var(--muted); }
.spark { display: block; }
.secundaria { margin-top: 14px; border-top: 1px solid var(--grid); padding-top: 10px; }
.secundaria > summary { cursor: pointer; font-weight: 600; font-size: 13px; padding: 4px 0; }
.secundaria > summary span { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; }
h2.seccion { font-size: 18px; margin: 28px 0 12px; }

/* Tipo de referencia: etiqueta neutra con el punto de color de su línea en los paneles. */
.tipo { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; color: var(--ink-2);
  background: var(--wash); border-radius: 999px; padding: 1px 8px 1px 6px; white-space: nowrap; line-height: 1.6; }
.tipo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
.t-benchmark::before { background: var(--s1); }
.t-domestico::before { background: var(--s2); }
.t-indice_inegi::before { background: var(--s3); }
.t-referencia_mx::before { background: var(--s4); }
.badge-pend { display: inline-block; font-size: 11px; font-weight: 600; color: var(--ink-2); border: 1px dashed var(--axis);
  border-radius: 999px; padding: 0 8px; line-height: 1.6; }
.tile .tipo-lbl { color: var(--muted); font-size: 11px; margin-top: 2px; }
.tile .mx { display: grid; grid-template-columns: 1fr auto; }
.tile .mx + .mx { border-top: 0; padding-top: 4px; margin-top: 0; }
.tile .mx small { grid-column: 1 / -1; color: var(--muted); font-size: 11px; }
.bloque + .bloque { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--grid); }
.bloque[hidden] { display: none; }
.bloque-tit { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.ficha { margin-top: 12px; border-top: 1px solid var(--grid); padding-top: 8px; }
.ficha summary { cursor: pointer; font-size: 12px; color: var(--ink-2); font-weight: 600; padding: 4px 0; }
.ficha ul { list-style: none; margin: 6px 0 0; padding: 0; }
.ficha li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--grid); font-size: 12px; }
.ficha li:first-child { border-top: 0; }
.fs-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.fs-mer { color: var(--ink); font-weight: 600; }
.fs-val { text-align: right; white-space: nowrap; }
.fs-val b { font-size: 14px; font-weight: 650; }
.fs-val small { display: block; color: var(--muted); font-size: 11px; }
.fs-det { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
.fs-det b { color: var(--ink-2); font-weight: 600; }
.ficha li.pend .fs-mer { color: var(--ink-2); font-weight: 500; }
.metodologia p, .metodologia li { color: var(--ink-2); font-size: 13px; max-width: 900px; }
.metodologia ul { padding-left: 18px; margin: 8px 0; }
.metodologia li { margin: 4px 0; }
.metodologia b { color: var(--ink); font-weight: 600; }
.criterio a { color: var(--ink-2); }
th .tipo { margin-bottom: 2px; }
.tabla-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
th:first-child, td:first-child { text-align: left; }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { background: var(--wash); }
.error { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="marca">
      <img src="logo-escala-capital.png" alt="Escala Capital">
      <span class="div" aria-hidden="true"></span>
    <div>
      <h1>Monitor de Commodities y Precios de Insumos</h1>
      <div class="meta">Energía · Metales · Agropecuarios — benchmarks internacionales, referencias México e índices INEGI para análisis de riesgo y crédito</div>
    </div>
    </div>
    <div class="hdr-der">
      <div class="meta" id="meta"></div>
      <div class="buscar no-print" role="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="buscador" type="search" placeholder="Buscar commodity, familia o sector…" autocomplete="off" aria-label="Buscar commodity" aria-controls="sugerencias">
        <ul id="sugerencias" role="listbox" hidden></ul>
      </div>
      <div class="controles no-print" role="toolbar" aria-label="Moneda y periodo">
        <div class="seg seg-sm" data-f="moneda" aria-label="Moneda"><button data-v="MXN">MXN</button><button data-v="USD">USD</button></div>
      </div>
    </div>
  </header>

  <div id="app"></div>
</main>

<script src="precios.js"></script>
<script src="app.js"></script>
</body>
</html>
