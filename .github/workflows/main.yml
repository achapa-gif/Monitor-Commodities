name: Actualizar y publicar dashboard

on:
  schedule:
    - cron: '0 13 * * *'   # todos los días a las 7:00 am, hora de Ciudad de México (13:00 UTC)
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar precios
        shell: powershell
        continue-on-error: true
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\actualizar.ps1

      - name: Guardar histórico en el repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data dashboard/precios.js
          git diff --cached --quiet || git commit -m "Actualización de precios $(date -u +%Y-%m-%d)"
          git push

      - name: Preparar sitio (cifrado si existe la clave)
        shell: powershell
        env:
          CLAVE_DASHBOARD: ${{ secrets.CLAVE_DASHBOARD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\preparar_sitio.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: _sitio

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: _sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deploy
        uses: actions/deploy-pages@v4
